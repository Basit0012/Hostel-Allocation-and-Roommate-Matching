<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hostel Allocation System{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            {% if user.is_authenticated %}
                <span>Signed in as: {{ user.email }} ({{ user.get_role_display }})</span>
                <a href="{% url 'accounts:logout' %}">Sign Out</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">Sign In</a>
                <a href="{% url 'accounts:register' %}">Student Registration</a>
            {% endif %}
        </nav>
    </header>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
